on:
  push:
    branches:
      - main
  pull_request:

name: Lint TOML

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo

      - name: Lint
        run: |
          taplo check
          taplo fmt --check --diff
