[package]
name = "matchbox_server"
version = "0.15.0"
authors = ["Johan Helsing <johanhelsing@gmail.com>"]
edition = "2024"
description = "A signaling server for WebRTC peer-to-peer full-mesh networking"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "webrtc", "peer-to-peer", "networking", "wasm"]
categories = [
  "network-programming",
  "game-development",
  "wasm",
  "web-programming",
]
repository = "https://github.com/johanhelsing/matchbox"
readme = "../README.md"

[dependencies]
matchbox_signaling = { version = "0.15", path = "../matchbox_signaling" }
matchbox_protocol = { version = "0.15", path = "../matchbox_protocol", features = [
  "json",
] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tokio = { version = "1.32", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
uuid = { version = "1.4", features = ["serde", "v4"] }
clap = { version = "4.3", features = ["derive", "env"] }
thiserror = "2.0"
tokio-stream = "0.1"

[dev-dependencies]
tokio-tungstenite = "0.30"

# Rejecting a websocket upgrade returns an axum `Response`, which is 128 bytes and
# rides in the `Err` of every connection-request callback. Boxing it would change a
# public signature that predates this lint.
[lints.clippy]
result_large_err = "allow"

# Predates the lint.
collapsible_match = "allow"
