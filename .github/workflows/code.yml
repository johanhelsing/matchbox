on:
  push:
    branches:
      - main
  pull_request:

name: Code

env:
  # Faster builds and smaller caches, nothing here reads the debuginfo
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test-native:
    name: Test Native
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            packages: --features signaling
          # Bevy is slow to build and not platform specific, so only ubuntu tests it
          - os: windows-latest
            packages: -p matchbox_socket -p matchbox_signaling -p matchbox_server -p matchbox_protocol
          - os: macos-latest
            packages: -p matchbox_socket -p matchbox_signaling -p matchbox_server -p matchbox_protocol
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test ${{ matrix.packages }} --all-targets

      - name: Run cargo doc tests
        run: cargo test ${{ matrix.packages }} --doc

  # Should be upgraded to test when possible
  test-browser:
    name: Test Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Chrome and Firefox come with the runner, wasm-pack fetches their drivers
      - name: Run browser tests
        run: cargo test -p matchbox_socket --test browser -- --ignored

      # The NAT tests run the browsers inside network namespaces, see tests/nat.rs. Must come
      # after the browser tests, which fetch the drivers: the namespaces have no internet.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run NAT traversal tests with browsers
        run: cargo test -p matchbox_socket --test nat -- --ignored chrome firefox --test-threads=2

  test-nat:
    name: Test NAT traversal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The test builds its NATs from network namespaces inside an unprivileged user namespace,
      # which Ubuntu's AppArmor blocks by default
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run NAT traversal tests
        run: cargo test -p matchbox_socket --test nat -- --ignored peers_

  check-wasm:
    name: Check Wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        # getrandom_backend="wasm_js" is needed for tracing to compile
        run: RUSTFLAGS='--cfg=web_sys_unstable_apis --cfg=getrandom_backend="wasm_js"' cargo check >
          --all-targets
          --target wasm32-unknown-unknown
          -p matchbox_socket
          -p bevy_matchbox
          -p bevy_ggrs_example
          -p simple_example
          -p custom_signaller

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo fmt --all --check


  lint-native:
    name: Lints native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo clippy --features signaling --all-targets -- -D warnings

  lint-wasm:
    name: Clippy wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: RUSTFLAGS='--cfg=web_sys_unstable_apis --cfg=getrandom_backend="wasm_js"' cargo clippy >
            --all-targets
            --target wasm32-unknown-unknown
            -p matchbox_socket
            -p bevy_matchbox
            -p bevy_ggrs_example
            -p simple_example
            -p custom_signaller
            --
            -D warnings

  server-container:
    name: Build & Push Server Container
    needs: [test-native, check-wasm, lint-native, lint-wasm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate Image Name
        run: echo IMAGE_REPOSITORY=ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "${{ github.repository }}")/matchbox_server >> $GITHUB_ENV

      - name: Log in to GitHub Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: "matchbox_server/Dockerfile"
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}
          load: ${{ ! (github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
