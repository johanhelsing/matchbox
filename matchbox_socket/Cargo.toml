[package]
name = "matchbox_socket"
version = "0.15.0"
authors = ["Johan Helsing <johanhelsing@gmail.com>"]
description = "Painless WebRTC peer-to-peer full-mesh networking socket"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "webrtc", "peer-to-peer", "networking", "wasm"]
categories = [
  "network-programming",
  "game-development",
  "wasm",
  "web-programming",
]
repository = "https://github.com/johanhelsing/matchbox"

[features]
default = ["tls12"]
ggrs = ["dep:bincode", "dep:ggrs"]
# TLS 1.2 for native `wss://` signaling, rustls is 1.3-only without it. No effect on wasm.
tls12 = ["dep:rustls", "rustls/tls12"]

[dependencies]
matchbox_protocol = { version = "0.15", path = "../matchbox_protocol", default-features = false }
futures-channel = { version = "0.3.32", default-features = false, features = [
  "sink",
] }
futures = { version = "0.3", default-features = false }
futures-timer = { version = "3.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "async-await-macro",
  "channel",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
thiserror = "2.0"
cfg-if = "1.0"
async-trait = "0.1"
once_cell = { version = "1.17", default-features = false, features = [
  "race",
  "alloc",
] }
derive_more = { version = "2.0", features = ["display", "from"] }

ggrs = { version = "0.13", default-features = false, optional = true }
bincode = { version = "2.0", default-features = false, features = [
  "serde",
  "alloc",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ggrs = { version = "0.13", default-features = false, optional = true, features = [
  "wasm-bindgen",
] }
ws_stream_wasm = { version = "0.7", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false }
futures-timer = { version = "3.0", default-features = false, features = [
  "wasm-bindgen",
] }
js-sys = { version = "0.3", default-features = false }
web-sys = { version = "0.3.22", default-features = false, features = [
  "MessageEvent",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcIceConnectionState",
  "RtcIceGatheringState",
  "RtcPeerConnection",
  "RtcPeerConnectionIceEvent",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
] }
serde-wasm-bindgen = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-tungstenite = { version = "0.35", default-features = false, features = [
  "smol-runtime",
  "futures-rustls-webpki-roots",
] }
webrtc = { version = "0.21", default-features = false, features = [
  "runtime-smol",
  "crypto-ring",
] }
# Only for the `tls12` feature: async-tungstenite builds futures-rustls without default
# features, which leaves rustls without TLS 1.2. The crypto provider (ring) comes from webrtc.
rustls = { version = "0.23", default-features = false, optional = true }
bytes = { version = "1.1", default-features = false }

[dev-dependencies]
futures-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
matchbox_signaling = { path = "../matchbox_signaling" }
tokio = { version = "1.32", features = ["macros", "rt-multi-thread", "time"] }
