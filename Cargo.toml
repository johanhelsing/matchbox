[workspace]
members = [
  "bevy_matchbox",
  "matchbox_protocol",
  "matchbox_socket",
  "matchbox_server",
  "matchbox_signaling",
  "examples/*",
]
resolver = "2" # Important! Bevy/WGPU needs this!

# Rejecting a websocket upgrade returns an axum `Response`, which is 128 bytes and
# rides in the `Err` of every connection-request callback. Boxing it would change a
# public signature that predates this lint.
[workspace.lints.clippy]
result_large_err = "allow"

# Predates the lint, in a crate this branch changes only the manifest of.
collapsible_match = "allow"
